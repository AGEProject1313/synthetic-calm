<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AETHOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <video autoplay muted loop playsinline class="background-video">
        <source src="assets/veyra.mp4" type="video/mp4">
    </video>

    <div class="video-overlay"></div>
    <div class="grid-overlay"></div>

    <main class="hero">
        <div class="hero-content">
            <div class="system-status">
                <div class="status-dot"></div>
                <span>AETHOS CORE ONLINE</span>
            </div>

            <h1>AETHOS</h1>

            <div class="subtitle">ADVANCED MONITORING INTERFACE</div>

            <p class="description">
                Centralized behavioral synchronization and citizen monitoring infrastructure
                operating across the Veyra District.
            </p>

            <div class="hero-actions">
                <button id="enterButton">ENTER A.M.I.</button>
                <button id="mobilityButton" class="secondary-button">MOBILITY GRID</button>
            </div>
        </div>
    </main>

<script src="../onionchat/caseProgress.js"></script>
<script src="script.js"></script>
</body>
</html>
