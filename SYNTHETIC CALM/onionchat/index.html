<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta name="theme-color" content="#0b141a">

    <title>OnionChat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- HOME -->
        <section class="screen home-screen active" id="homeScreen">

            <header class="home-header">
                <div>
                    <h1>OnionChat</h1>
                    <p>Secure relay active</p>
                </div>

                <button class="icon-btn" id="openAddContactModal" type="button">
                    +
                </button>
            </header>

            <div class="search-box">
                <span>⌕</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search or start a chat"
                    autocomplete="off"
                >
            </div>

            <main class="contact-list" id="contactList"></main>

        </section>

        <!-- CHAT -->
        <section class="screen chat-screen" id="chatScreen">

            <header class="chat-header">

                <button class="back-btn" id="backButton" type="button">
                    ←
                </button>

                <div class="avatar chat-avatar" id="chatAvatar"></div>

                <div class="chat-info">
                    <div class="chat-name" id="chatName"></div>
                    <div class="chat-status" id="chatStatus"></div>
                </div>

                <button class="media-btn" id="openMediaButton" type="button" aria-label="Open multimedia files">
                    ▣
                </button>

            </header>

            <main class="chat-messages" id="chatMessages"></main>

            <footer class="chat-input-area">
                <button id="attachButton" class="attach-btn" type="button" aria-label="Attach screenshot">
                    📎
                </button>

                <input
                    type="file"
                    id="screenshotInput"
                    accept="image/*"
                    hidden
                >

                <input
                    type="text"
                    id="messageInput"
                    placeholder="Message"
                    autocomplete="off"
                >

                <button id="sendButton" type="button">
                    Send
                </button>
            </footer>

        </section>

    </div>

    <!-- ADD CONTACT MODAL -->
    <div class="modal-overlay" id="addContactModal">

        <div class="modal-card">

            <div class="modal-title">Add contact</div>

            <input
                type="text"
                id="phoneInput"
                autocomplete="off"
            >

            <div class="modal-actions">
                <button type="button" id="cancelAddContact">Cancel</button>
                <button type="button" id="confirmAddContact">Add</button>
            </div>

        </div>

    </div>

    <!-- MEDIA MODAL -->
    <div class="modal-overlay" id="mediaModal">

        <div class="modal-card media-modal-card">

            <div class="media-modal-header">
                <div class="modal-title">Multimedia</div>
                <button type="button" class="media-close" id="closeMediaModal">×</button>
            </div>

            <div class="media-list" id="mediaList"></div>
            <div class="media-viewer" id="mediaViewer"></div>

        </div>

    </div>

    <!-- PUSH -->
    <div class="push-container" id="pushContainer"></div>

<script src="data/contacts.js"></script>
<script src="caseProgress.js"></script>
<script src="script.js"></script>

</body>
</html>
